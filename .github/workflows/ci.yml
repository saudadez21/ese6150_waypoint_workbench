name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python runtime and tests
        run: python -m pip install -e . pytest
      - name: Python tests (including Flask integration)
        run: python -m pytest -q
      - name: JavaScript tests
        run: node --test tests/*.mjs
