[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waypoint-workbench"
version = "0.2.0"
description = "Offline F1TENTH waypoint editing and ROS 2 recording"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=2.3,<4",
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=9.0",
    "PyYAML>=6.0",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff==0.14.6",
    "pre-commit>=4.0,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["waypoint_workbench*"]

[tool.setuptools.package-data]
waypoint_workbench = ["web/*.html", "web/*.css", "web/js/*.js", "web/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
indent-width = 4
# ROS 2 Humble commonly uses Python 3.10; do not assume Python 3.13 features.
target-version = "py310"
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4", "I", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
