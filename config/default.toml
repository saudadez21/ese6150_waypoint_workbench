[paths]
maps = "maps"
waypoints = "waypoints"
default_map = "Spielberg"
default_waypoint = "Spielberg_centerline.csv"

[editor]
max_tracks = 5
# Distinct colors for loaded tracks. Provide at least max_tracks unique colors.
track_colors = [
    "#60a5fa",
    "#fbbf24",
    "#34d399",
    "#e879f9",
    "#fb7185",
    "#a78bfa",
    "#22d3ee",
    "#fb923c",
]
closure_max_gap_m = 0.75
max_points = 20000

[vehicle]
wheelbase_m = 0.33
max_steer_rad = 0.4189
length_m = 0.58
width_m = 0.31
center_x_from_base_link_m = 0.165
steer_rate_radps = 3.2

[clearance]
safety_margin_m = 0.10
unknown_is_obstacle = true

[server]
host = "127.0.0.1"
port = 5050
