repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        exclude: ^tests/
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^web/.*\.(js|css|html)$
        exclude: '^web/vendor/'
        additional_dependencies: [prettier@3.1.0]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '(^web/vendor/|\.(pgm|png|bmp|jpe?g|zip)$)'
      - id: end-of-file-fixer
        entry: python -m pre_commit_hooks.end_of_file_fixer
        exclude: '(^web/vendor/|\.(pgm|png|bmp|jpe?g|zip)$)'
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '(^web/vendor/|\.(pgm|png|bmp|jpe?g|zip)$)'
      - id: check-yaml
        entry: python -m pre_commit_hooks.check_yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
        entry: python -m pre_commit_hooks.check_merge_conflict
      - id: check-added-large-files
        entry: python -m pre_commit_hooks.check_added_large_files
        args: [--maxkb=4096]
